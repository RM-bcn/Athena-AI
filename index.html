<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        if (!params.has('pwa-reset')) return;
        var finish = function () {
          params.delete('pwa-reset');
          var qs = params.toString();
          window.history.replaceState(null, '', window.location.pathname + (qs ? '?' + qs : '') + window.location.hash);
          window.location.reload();
        };
        var jobs = [];
        if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
          jobs.push(
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              return Promise.all(regs.map(function (reg) { return reg.unregister(); }));
            })
          );
        }
        if (window.caches && window.caches.keys) {
          jobs.push(
            window.caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (key) { return window.caches.delete(key); }));
            })
          );
        }
        Promise.all(jobs).then(finish, finish);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Jouw persoonlijke reisconcierge voor de Griekse Cycladen." />
    <meta name="theme-color" content="#005BAE" />
    <title>Athena AI — Mediterranean Concierge</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Athena AI" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  </head>

  </body>
</html>
